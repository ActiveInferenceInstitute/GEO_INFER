[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-transport"
version = "0.3.0"
description = "Transportation planning and traffic analysis for geospatial systems"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "transportation",
    "traffic",
    "routing",
    "network-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "networkx>=2.6.0",
]

[project.optional-dependencies]
test = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "shapely>=2.0.0",
    "geopandas>=0.13.0",
]
log = ["geo-infer-log>=0.3.0"]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.uv.sources]
geo-infer-log = { workspace = true }

