[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-act"
version = "0.4.0"
description = "Advanced Active Inference framework implementing Free Energy Principle for geospatial decision-making, perception, and learning"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "active inference",
    "geoinformatics",
    "free-energy-principle",
    "variational-inference",
    "bayesian",
    "perception-action-loops",
    "intelligent-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "matplotlib>=3.4.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pyyaml>=6.0",
    "requests>=2.25.0",
    "scipy>=1.7.0",
    "seaborn>=0.11.0",
    "inferactively-pymdp==1.0.3",
    "h3>=4.5.0,<5",
    "geo-infer-bayes>=0.4.0",
]

[project.optional-dependencies]
backends = [
    "torch>=1.9.0",
    "pyro-ppl>=1.7.0",
    "pymc>=4.0.0",
    "arviz>=0.11.0",
    "bayeux-ml>=0.0.1",
    "flowmc>=0.3.0,<0.4",
    "jax>=0.4.38,<0.5",
    "optax>=0.1.7,<0.2.6",
    "networkx>=2.6.0",
    "shapely>=2.0.0",
    "imageio>=2.9.0",
    "plotly>=5.0.0",
]
space = ["geo-infer-space>=0.4.0"]
gnn = ["geo-infer-time>=0.4.0"]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
    "geo-infer-ai>=0.4.0",
    # Test-only dependencies (imported by tests/, not by src/)
    "geopandas>=0.13.0",
    "hypothesis>=6.0.0",
    "pillow>=8.3.0",
    "psutil>=7.0.0",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]
integrations = [
    # Workspace siblings imported by this module's tests (resolved via [tool.uv.sources])
    "geo-infer-test>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[project.scripts]
geo-infer-act-run = "geo_infer_act.runners.cli:main"
geo-infer-act-examples = "geo_infer_act.runners.cli:run_all_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.uv.sources]
geo-infer-ai = { workspace = true }
geo-infer-bayes = { workspace = true }
geo-infer-space = { workspace = true }
geo-infer-time = { workspace = true }
geo-infer-test = { workspace = true }
