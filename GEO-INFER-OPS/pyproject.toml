[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-ops"
version = "0.4.0"
description = "System orchestration, monitoring, infrastructure management, and deployment automation for the GEO-INFER ecosystem"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "active inference",
    "geoinformatics",
    "operations",
    "orchestration",
    "monitoring",
    "infrastructure",
    "deployment",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "fastapi>=0.100.0",
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=5.7.0",
    "pydantic>=2.0.0",
    "structlog>=21.1.0",
    "kubernetes>=29.0.0",
    "redis>=4.5.0",
    "PyJWT>=2.0.0",
    "cryptography>=40.0.0",
    "psutil>=5.9.0",
    "PyYAML>=6.0.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-timeout>=2.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-asyncio"
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[dependency-groups]
# Workspace siblings imported by this module's tests (resolved via [tool.uv.sources]).
test = [
    "geo-infer-act>=0.4.0",
    "geo-infer-agent>=0.4.0",
    "geo-infer-bayes>=0.4.0",
    "geo-infer-iot>=0.4.0",
    "geo-infer-math>=0.4.0",
    "geo-infer-place>=0.4.0",
    "geo-infer-sec>=0.4.0",
    "geo-infer-sim>=0.4.0",
    "geo-infer-space>=0.4.0",
]

[tool.uv.sources]
geo-infer-act = { workspace = true }
geo-infer-agent = { workspace = true }
geo-infer-bayes = { workspace = true }
geo-infer-iot = { workspace = true }
geo-infer-math = { workspace = true }
geo-infer-place = { workspace = true }
geo-infer-sec = { workspace = true }
geo-infer-sim = { workspace = true }
geo-infer-space = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
