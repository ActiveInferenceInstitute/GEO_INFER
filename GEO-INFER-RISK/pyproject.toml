[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-risk"
version = "0.4.0"
description = "Advanced risk analysis and catastrophe modeling framework for geospatial applications including insurance, hazard assessment, and resilience planning"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "active inference",
    "geoinformatics",
    "risk",
    "insurance",
    "hazard",
    "catastrophe",
    "resilience",
    "modeling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "jsonschema>=4.17.0",
    "pyyaml>=6.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
# Optional cross-module GEO-INFER integrations. Every import of these
# packages in src/ is guarded with try/except and degrades gracefully;
# install this extra to enable the spatial/temporal/bayesian/data
# integration surfaces.
integrations = [
    "geo-infer-space>=0.4.0",
    "geo-infer-time>=0.4.0",
    "geo-infer-math>=0.4.0",
    "geo-infer-bayes>=0.4.0",
    "geo-infer-data>=0.4.0",
    # Workspace siblings imported by this module's tests (resolved via [tool.uv.sources])
    "geo-infer-test>=0.4.0",
]

# Optional machine-learning backend for hotspot clustering. The KMeans
# hotspot analysis in geo_infer_risk.core.catastrophe_models imports
# sklearn.cluster inside a guarded try/except and degrades gracefully to
# simple centroid hotspots when scikit-learn is absent; install this
# extra to enable the clustering path.
ml = [
    "scikit-learn>=1.0",
    "joblib>=1.0",
]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]

[tool.uv.sources]
geo-infer-space = { workspace = true }
geo-infer-time = { workspace = true }
geo-infer-math = { workspace = true }
geo-infer-bayes = { workspace = true }
geo-infer-data = { workspace = true }
geo-infer-test = { workspace = true }

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
