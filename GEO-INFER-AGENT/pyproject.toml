[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-agent"
version = "0.4.0"
description = "Intelligent autonomous agents for geospatial decision-making, perception, and action with Active Inference, BDI, and reinforcement learning architectures"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "active inference",
    "geoinformatics",
    "autonomous-agents",
    "intelligent-systems",
    "bdi",
    "active-inference",
    "reinforcement-learning",
    "multi-agent-systems",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.23.5",
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.2",
    "fastapi>=0.104.0",
    "pydantic>=2.5.0",
    "pandas>=1.3.0",
    "uvicorn>=0.24.0",
]

[project.optional-dependencies]
integrations = [
    # Optional, try/except-guarded import in geo_infer_agent.api.telemetry
    # (resource monitoring is disabled without it).
    "psutil>=5.9.0",
]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.24.0",
    "matplotlib>=3.7.1",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[project.scripts]
geo-infer-agent = "geo_infer_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
