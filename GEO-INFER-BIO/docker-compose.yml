version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: GEO-INFER-BIO/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - geo-infer-network

  graphql:
    build:
      context: ..
      dockerfile: GEO-INFER-BIO/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "uvicorn", "geo_infer_bio.api.graphql_api:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/graphql?query={__typename}')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - geo-infer-network

networks:
  geo-infer-network:
    driver: bridge 