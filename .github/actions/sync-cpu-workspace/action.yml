name: Sync CPU workspace
description: Install every locked workspace member, extra and dependency group on CPU runners.
runs:
  using: composite
  steps:
    - name: Install locked CPU dependencies
      shell: bash
      run: |
        # These optional native extras require CUDA or incompatible hosted
        # VTK/C++ toolchains. All other extras and every dependency group stay
        # installed. A cache hit never substitutes for the locked sync.
        uv sync --locked --python "$(command -v python)" --all-packages --all-extras --all-groups \
          --no-install-package cupy --no-install-package mayavi \
          --no-install-package vaex --no-install-package vaex-core
