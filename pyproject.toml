[project]
name = "geo-infer-framework"
version = "0.4.0"
description = "Comprehensive geospatial inference framework for ecological, civic, and commercial applications"
authors = [
    {name = "docxology", email = "docxology@users.noreply.github.com"}
]
readme = "README.md"
license = {text = "CC BY-NC-SA 4.0"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["geospatial", "active inference", "geoinformatics", "spatial analysis", "bayesian inference"]

# Core dependencies required by all modules
dependencies = [
    # Core scientific computing
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    # Geospatial libraries
    "geopandas>=0.10.0",
    "shapely>=2.0.0",
    "h3>=4.5.0,<5",
    "pyproj>=3.3.0",
    "rasterio>=1.2.0",
    "xarray>=0.19.0",
    "dask>=2021.9.0",
    # Spatial indexing and analysis
    "rtree>=0.9.0",
    "fiona>=1.8.0",
    # Time series and temporal analysis
    "cftime>=1.5.0",
    "netCDF4>=1.5.7",
    # Data access and APIs
    "requests>=2.31.0",
    "urllib3>=2.0.6",
    "aiohttp>=3.9.0",
    # Configuration and serialization
    "pyyaml>=5.4.0",
    "toml>=0.10.0",
    "jsonschema>=3.2.0",
    # Visualization and plotting
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "plotly>=5.3.0",
    "folium>=0.12.0",
    "branca>=0.4.0",
    # Utilities
    "click>=8.0.0",
    "tqdm>=4.62.0",
    "python-dateutil>=2.8.0",
    "pytz>=2021.1",
    "rich>=12.0.0",
    "geojson-pydantic>=2.0.0",
    "osmnx>=2.0.6",
    "laspy>=2.6.1",
]

# Optional dependencies for enhanced functionality
[project.optional-dependencies]
# AI and Machine Learning
ai = [
    "tensorflow>=2.6.0",
    "torch>=1.9.0",
    "xgboost>=1.4.0",
    "lightgbm>=3.2.0",
    "optuna>=2.10.0",
]

# Bayesian inference
bayesian = [
    "pymc>=5.0.0",
    "pytensor>=2.31.7,<2.32",
    "arviz>=0.11.0",
    "emcee>=3.1.0",
    "corner>=2.2.0",
]

# Simulation and modeling
simulation = [
    "mesa>=0.8.9",
    "networkx>=2.6.0",
    "simpy>=3.0.0",
]

# Bioinformatics
bio = [
    "biopython>=1.79",
    "scikit-bio>=0.5.6",
    "ete3>=3.1.0",
]

# Health applications
health = [
    "lifelines>=0.26.0",
    # PyMC 5 uses the PyTensor runtime pinned by the bayesian profile.
    "pymc>=5.0.0",
]

# Climate and environmental
climate = [
    "cf-units>=3.0.0",
    "cdo>=1.5.0",
    "xclim>=0.40.0",
]

# Native columnar data integrations
data = [
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "pymongo>=4.5.0",
    "xarray>=2023.1.0",
]

# Performance optimization
performance = [
    "numba>=0.54.0",
    "cupy>=9.4.0; sys_platform != 'darwin'",
    "dask[complete]>=2021.9.0",
    "vaex>=4.13.0; python_version < '3.12'",
]

# Quality assurance and testing
quality = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
    "hypothesis>=6.0.0",
    "ruptures>=1.1.9",
    "srai>=0.10.2",
]

# Documentation
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]

# Web and API development
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.15.0",
    "pydantic>=2.0.0",
    "starlette>=0.14.0",
    "jinja2>=3.1.3",
]

# IoT and real-time
iot = [
    "paho-mqtt>=1.6.0",
    "aiomqtt>=2.4.0",
    "websockets>=10.0",
    "influxdb-client>=1.24.0",
]

# All optional dependencies (expanded; avoid self-referencing extras)
all = [
    # ai
    "tensorflow>=2.6.0",
    "torch>=1.9.0",
    "xgboost>=1.4.0",
    "lightgbm>=3.2.0",
    "optuna>=2.10.0",
    # bayesian
    "arviz>=0.11.0",
    "pytensor>=2.31.7,<2.32",
    "emcee>=3.1.0",
    "corner>=2.2.0",
    # simulation
    "mesa>=0.8.9",
    "networkx>=2.6.0",
    "simpy>=3.0.0",
    # bio
    "biopython>=1.79",
    "scikit-bio>=0.5.6",
    "ete3>=3.1.0",
    # health
    "lifelines>=0.26.0",
    "pymc>=5.0.0",
    # climate (excluding climtas)
    "cf-units>=3.0.0",
    "cdo>=1.5.0",
    "xclim>=0.40.0",
    # data
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "pymongo>=4.5.0",
    "xarray>=2023.1.0",
    # performance
    "numba>=0.54.0",
    "cupy>=9.4.0; sys_platform != 'darwin'",
    "dask[complete]>=2021.9.0",
    "vaex>=4.13.0; python_version < '3.12'",
    # quality
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.0.0",
    "ruptures>=1.1.9",
    "srai>=0.10.2",
    # docs
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
    # web
    "fastapi>=0.100.0",
    "uvicorn>=0.15.0",
    "pydantic>=2.0.0",
    "starlette>=0.14.0",
    "jinja2>=3.1.3",
    # iot
    "paho-mqtt>=1.6.0",
    "aiomqtt>=2.4.0",
    "websockets>=10.0",
    "influxdb-client>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://github.com/ActiveInferenceInstitute/GEO_INFER/tree/main/GEO-INFER-INTRA/docs"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"
Discord = "https://discord.activeinference.institute/"

[project.scripts]
# NOTE: Intentionally omitted at root. Use module-provided CLIs and
# `GEO-INFER-TEST/run_unified_tests.py` for testing.

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "geopandas.*",
    "h3.*",
    "folium.*",
    "plotly.*",
    "matplotlib.*",
    "scipy.*",
    "sklearn.*",
    "shapely.*",
    "seaborn.*",
    "statsmodels.*",
    "rasterio.*",
    "joblib",
    "pulp",
    "ortools.*",
    "contextily",
    "kubernetes.*",
    "networkx",
    "pydantic",
    "tensorflow.*",
    "torch.*",
    "pymc.*",
    "arviz.*",
    "tqdm.*",
    "boto3",
    "boto3.*",
    "yaml",
    "requests",
    "jsonschema",
    "geo_infer_log.*",
    "geo_infer_data.*",
    "geo_infer_time.*",
    "geo_infer_space.*",
    "geo_infer_act.*",
    "geo_infer_agent.*",
    "geo_infer_sec.utils.geospatial_utils",
    "geo_infer_spm.utils.visualization",
    "flask",
    "flask.*",
    "werkzeug",
    "werkzeug.*",
    "psutil",
    "psutil.*",
    "z3",
    "z3.*",
    "symengine",
    "symengine.*",
    "pywt",
    "mayavi.*",
    "mplcursors",
    "mpl_toolkits.*",
    "ruptures",
    "h5py",
    "mesa",
    "mesa.*",
    "pymdp",
    "pymdp.*",
    "bayeux",
    "bayeux.*",
    "julia",
    "julia.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
minversion = "6.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-W",
    "error",
]
testpaths = [
    "GEO-INFER-*/tests",
    "tests",
    "GEO-INFER-PLACE/locations/cascadia/tests",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
    "system: marks tests as system/e2e tests",
    "core: marks tests for core module behavior",
    "geospatial: marks tests involving spatial operations",
    "api: marks tests related to API functionality",
    "reporting: marks tests for reporting and visualization outputs",
    "fast: marks tests intended to run quickly",
    "model: marks model-contract and model-behavior tests",
    "reproducibility: marks deterministic replay and artifact tests",
    "artifact: marks generated artifact and visualization tests",
    "spatial: marks spatial/geospatial behavior tests",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["GEO-INFER-*/src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["GEO-INFER-*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Repository-wide lint contract: pyflakes/pycodestyle errors, modern syntax for
# the Python 3.11 floor (pyupgrade), bugbear correctness checks, and NumPy
# Generator-only randomness in library code.
select = ["E4", "E7", "E9", "F", "UP", "B", "NPY"]
ignore = [
    "B008",  # FastAPI/Typer dependency injection uses calls in defaults.
    "B905",  # zip(strict=...) changes runtime semantics; opt in per call site.
    "UP042", # StrEnum changes str()/format() output of existing enums.
]

[tool.ruff.lint.per-file-ignores]
# Tests, examples and orchestration scripts may seed the global NumPy stream.
"**/tests/**" = ["NPY002"]
"**/examples/**" = ["NPY002"]
"**/scripts/**" = ["NPY002"]
"GEO-INFER-PLACE/locations/**" = ["NPY002"]
"manuscript/**" = ["NPY002"]
"tests/**" = ["NPY002"]
