[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-sec"
version = "0.3.0"
description = "Comprehensive security and privacy framework for geospatial information systems with encryption, access control, and compliance"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "active inference",
    "geoinformatics",
    "security",
    "privacy",
    "encryption",
    "access-control",
    "compliance",
    "authentication",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "cryptography>=36.0.0",
    "flask>=2.0",
    "geopandas>=0.13.0",
    "h3>=4.5.0,<5",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pyjwt>=2.3.0",
    "pyyaml>=6.0",
    "shapely>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.20.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
    # Test-only dependencies (imported by tests/, not by src/)
    "minio>=7.1.0",
    "redis>=4.5.0",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]

# Optional machine-learning backend for cognitive-security analytics. The
# anomaly detection in geo_infer_sec.core.cognitive_security imports
# sklearn/joblib inside a guarded try/except (ML_AVAILABLE) and degrades
# gracefully when scikit-learn is absent; install this extra to enable
# the ML detection path.
ml = [
    "scikit-learn>=1.0",
    "joblib>=1.0",
]
integrations = [
    # Workspace siblings imported by this module's tests (resolved via [tool.uv.sources])
    "geo-infer-data>=0.3.0",
    "geo-infer-git>=0.3.0",
    "geo-infer-ops>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[project.scripts]
geo-infer-sec = "geo_infer_sec.cli:main"

[tool.uv.sources]
geo-infer-data = { workspace = true }
geo-infer-git = { workspace = true }
geo-infer-ops = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "geopandas.*",
    "h3.*",
    "folium.*",
    "plotly.*",
    "matplotlib.*",
    "scipy.*",
    "sklearn.*",
    "tensorflow.*",
    "torch.*",
    "pymc.*",
    "arviz.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
