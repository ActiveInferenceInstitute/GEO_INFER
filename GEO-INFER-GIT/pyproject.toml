[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-git"
version = "0.4.0"
description = "Version control and repository management tools specifically designed for geospatial data and code collaboration"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "active inference",
    "geoinformatics",
    "version-control",
    "git",
    "repository",
    "collaboration",
    "geospatial-data",
    "data-versioning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "urllib3>=2.0.6",
    "fastapi>=0.104.0",
    "starlette>=0.27.0",
    "GitPython>=3.1.0",
    "jsonschema>=4.17.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "requests>=2.28.1",
    "tqdm>=4.65.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
integrations = [
    "redis>=4.5.0",
    # Workspace siblings imported by this module's tests (resolved via [tool.uv.sources])
    "geo-infer-test>=0.4.0",
]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
    "radon>=5.1.0",
    # Test-only dependencies (imported by tests/, not by src/)
    "geopandas>=0.13.0",
    "numpy>=1.20.0",
    "shapely>=2.0.0",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[project.scripts]
geo-infer-git = "geo_infer_git.cli:main"

[tool.uv.sources]
geo-infer-test = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
