[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-place"
version = "0.4.0"
description = "Comprehensive place-based analysis framework providing deep insights into specific geographic locations and regional systems"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "active inference",
    "geoinformatics",
    "place-based-analysis",
    "regional-intelligence",
    "territorial-assessment",
    "local-insights",
    "geographic-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "urllib3>=2.0.6",
    "geopandas>=0.13.0",
    "networkx>=2.6.0",
    "shapely>=2.0.0",
    "h3>=4.5.0,<5",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pyyaml>=6.0",
    "folium>=0.14.0",
    "plotly>=5.0.0",
    "matplotlib>=3.5.0",
    "branca>=0.6.0",
    "requests>=2.28.0",
    "geo-infer-space>=0.4.0",
    "geo-infer-time>=0.4.0",
]

[project.optional-dependencies]
cascadia = [
    "colorcet>=3.0.0",
    "beautifulsoup4>=4.11.0",
    "bokeh>=2.4.0",
    "branca>=0.6.0",
    "contextily>=1.2.0",
    "datashader>=0.14.0",
    "fastapi>=0.100.0",
    "fiona>=1.8.0",
    "folium>=0.14.0",
    "geo-infer-bayes>=0.4.0",
    "geo-infer-climate>=0.4.0",
    "geo-infer-data>=0.4.0",
    "geo-infer-econ>=0.4.0",
    "geo-infer-forest>=0.4.0",
    "geo-infer-marine>=0.4.0",
    "geo-infer-math>=0.4.0",
    "geo-infer-risk>=0.4.0",
    "geopandas>=0.10.0",
    "h3>=4.5.0,<5",
    "holoviews>=1.15.0",
    "html5lib>=1.1",
    "jinja2>=3.1.0",
    "lxml>=4.9.0",
    "matplotlib>=3.4.0",
    "networkx>=2.6.0",
    "numpy>=1.21.0",
    "openpyxl>=3.0.0",
    "pandas>=1.3.0",
    "psutil>=5.9.0",
    "pyproj>=3.2.0",
    "python-dotenv>=0.19.0",
    "pyyaml>=5.4.0",
    "rasterio>=1.2.0",
    "requests>=2.25.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "seaborn>=0.11.0",
    "selenium>=4.0.0",
    "shapely>=2.0.0",
    "tqdm>=4.62.0",
    "urllib3>=1.26.0",
    "uvicorn>=0.22.0",
    "webdriver-manager>=3.8.0",
]
full = [
    "geo-infer-data>=0.4.0",
    "geo-infer-time>=0.4.0",
]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
    # Test-only dependencies (imported by tests/, not by src/)
    "pyproj>=3.3.0",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]
integrations = [
    # Workspace siblings imported by this module's tests (resolved via [tool.uv.sources])
    "geo-infer-test>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.geojson", "*.json", "*.md", "*.txt"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.uv.sources]
geo-infer-space = { workspace = true }
geo-infer-data = { workspace = true }
geo-infer-time = { workspace = true }
geo-infer-test = { workspace = true }
geo-infer-bayes = { workspace = true }
geo-infer-climate = { workspace = true }
geo-infer-econ = { workspace = true }
geo-infer-forest = { workspace = true }
geo-infer-marine = { workspace = true }
geo-infer-math = { workspace = true }
geo-infer-risk = { workspace = true }
