name: Frozen workspace dependency audit

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
  schedule:
    - cron: "35 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Install the isolated advisory tool
        run: |
          uv venv "${{ runner.temp }}/dependency-audit-tools" --python "$(command -v python)"
          uv pip install --python "${{ runner.temp }}/dependency-audit-tools/bin/python" "pip-audit==2.10.1" "psutil==7.0.0"
      - name: Audit every frozen workspace package version
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-dependency-audit
        run: |
          "${{ runner.temp }}/dependency-audit-tools/bin/python" GEO-INFER-TEST/audit_dependencies.py \
            --auditor "${{ runner.temp }}/dependency-audit-tools/bin/pip-audit" \
            --timeout 1200
      - name: Retain actual inventory, advisories and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geo-infer-dependency-audit
          path: .geo-infer-test-results/dependency-audit/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
