[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-iot"
version = "0.4.0"
description = "IoT sensor networks, real-time geospatial data streams, and sensor data fusion for environmental monitoring"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "active inference",
    "geoinformatics",
    "iot",
    "sensors",
    "real-time",
    "streaming",
    "monitoring",
    "environmental",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "aiomqtt>=2.4.0",
    "fastapi>=0.100.0",
    "geo-infer-bayes>=0.4.0",
    "geo-infer-space>=0.4.0",
    "geo-infer-time>=0.4.0",
    "h3>=4.5.0,<5",
    "networkx>=2.6",
    "numpy>=1.20.0",
    "paho-mqtt>=1.6.0",
    "pandas>=1.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "uvicorn>=0.15.0",
    "websockets>=10.0",
]

[project.optional-dependencies]
visualization = ["folium>=0.12.0", "matplotlib>=3.5.0"]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
    # Test-only spatial dependencies (tests/conftest.py)
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]
lorawan = [
    "lora>=0.2.0",
    "chirpstack-api>=3.12.0",
]
satellite = [
    "pyorbital>=1.7.0",
    "sgp4>=2.20",
]
advanced = [
    "gpytorch>=1.6.0",
    "pymc>=4.0.0",
    "arviz>=0.12.0",
]
# Optional protocol/storage/visualization integrations whose imports are
# guarded in the source (see core/ingestion.py, performance/__init__.py).
coap = ["aiocoap>=0.4.3"]
kafka = ["confluent-kafka>=1.8.0"]
storage = ["influxdb-client>=1.24.0"]
serial = ["pyserial>=3.5"]
plot = ["plotly>=5.0.0"]
performance = ["psutil>=5.8.0"]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.uv.sources]
geo-infer-space = { workspace = true }
geo-infer-bayes = { workspace = true }
geo-infer-time = { workspace = true }
