[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-test"
version = "0.3.0"
description = "Unified testing framework for quality assurance across all GEO-INFER modules with automated testing, performance benchmarks, and integration validation"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "active inference",
    "geoinformatics",
    "testing",
    "quality-assurance",
    "validation",
    "performance",
    "integration",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "coverage[toml]>=7.0.0",
    "geopandas>=0.13.0",
    "h3>=4.5.0,<5",
    "hypothesis>=6.0.0",
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "psutil>=5.9.0",
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=4.0.0",
    "pytest-html>=3.1.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
load = [
    "locust>=2.0.0",
    "requests>=2.28.0",
]
browser = [
    "selenium>=4.0.0",
]
reporting = [
    "jinja2>=3.1.0",
    "jsonschema>=4.0.0",
    "tabulate>=0.9.0",
    "seaborn>=0.11.0",
]
synthetic = [
    "factory-boy>=3.2.0",
    "faker>=18.0.0",
]
profiling = [
    "memory-profiler>=0.60.0",
]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
    # Test-only dependencies (imported by tests/, not by src/)
    "pyproj>=3.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "shapely>=2.0.0",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]
integrations = [
    # Workspace siblings imported by this module's tests (resolved via [tool.uv.sources])
    "geo-infer-act>=0.3.0",
    "geo-infer-ag>=0.3.0",
    "geo-infer-agent>=0.3.0",
    "geo-infer-ai>=0.3.0",
    "geo-infer-ant>=0.3.0",
    "geo-infer-api>=0.3.0",
    "geo-infer-app>=0.3.0",
    "geo-infer-bayes>=0.3.0",
    "geo-infer-data>=0.3.0",
    "geo-infer-econ>=0.3.0",
    "geo-infer-health>=0.3.0",
    "geo-infer-math>=0.3.0",
    "geo-infer-risk>=0.3.0",
    "geo-infer-sec>=0.3.0",
    "geo-infer-space>=0.3.0",
    "geo-infer-time>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[tool.uv.sources]
geo-infer-act = { workspace = true }
geo-infer-ag = { workspace = true }
geo-infer-agent = { workspace = true }
geo-infer-ai = { workspace = true }
geo-infer-ant = { workspace = true }
geo-infer-api = { workspace = true }
geo-infer-app = { workspace = true }
geo-infer-bayes = { workspace = true }
geo-infer-data = { workspace = true }
geo-infer-econ = { workspace = true }
geo-infer-health = { workspace = true }
geo-infer-math = { workspace = true }
geo-infer-risk = { workspace = true }
geo-infer-sec = { workspace = true }
geo-infer-space = { workspace = true }
geo-infer-time = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pandas.*",
    "geopandas.*",
    "h3.*",
    "folium.*",
    "plotly.*",
    "matplotlib.*",
    "scipy.*",
    "sklearn.*",
    "tensorflow.*",
    "torch.*",
    "pymc.*",
    "arviz.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
