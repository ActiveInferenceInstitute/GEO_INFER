name: GEO-INFER Wheel Release

# Unified multi-package wheel release pipeline (ARCH-01).
# Builds a wheel for every GEO-INFER-* package, validates that every built wheel
# belongs to the shared ``geo-infer-*`` PyPI namespace, and runs packaging
# configuration validation across the monorepo.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_isolated_verify:
        description: "Install each wheel into isolated venvs and smoke test"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # GS-002: the ci-gate job polls `gh run list` for the CI run on the tagged
  # commit; without actions:read that call fails closed on the first tag.
  actions: read

# GS19-22: the release publishes fleet wheels; a second tag push or dispatch
# for the same release target must queue behind the running release, never
# race it. cancel-in-progress is deliberately omitted (releases are not
# preemptible).
# CI-08: the group is keyed on the release target, not on github.ref. Every
# run that can write the release object of tag X (the tag push and any
# workflow_dispatch recovery run at that tag) resolves to `tag-X`; branch
# dispatches, which never touch a release object, share one fixed
# `dispatch` group instead of fanning out per branch.
concurrency:
  group: geo-infer-release-${{ github.ref_type == 'tag' && format('tag-{0}', github.ref_name) || 'dispatch' }}

jobs:
  ci-gate:
    # GS-002: a tag can point at any commit; the wheel release must not
    # upload artifacts until full CI has passed on the tagged revision.
    # The gate polls the GEO-INFER CI run for this exact SHA (ci.yml also
    # triggers on v* tags) and fails closed on failure, cancellation, or a
    # 120-minute wait ceiling. Manual dispatches skip the gate.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    outputs:
      # REL-03: the release job sources the manuscript PDF from exactly the
      # CI run this gate validated, never from another run on the SHA.
      ci_run_id: ${{ steps.wait_ci.outputs.ci_run_id }}
    steps:
      - name: Wait for CI success on the tagged commit
        id: wait_ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 7200 ))
          while :; do
            # CI-07: a tagged main-tip SHA carries several ci.yml runs (the
            # main push, the tag push, schedule/dispatch runs). An unfiltered
            # `--limit 1` returned whichever row was newest, so a superseded
            # and cancelled main-push run shadowed the tag's own run and
            # failed the release. Poll only the tag-push run: tag-push runs
            # carry the tag name as their head branch.
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --event push --branch "$GITHUB_REF_NAME" --limit 1 \
              --json databaseId,status,conclusion --jq '.[0] // empty')"
            if [ -n "$row" ]; then
              status="$(printf '%s' "$row" | jq -r .status)"
              conclusion="$(printf '%s' "$row" | jq -r '.conclusion // ""')"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  run_id="$(printf '%s' "$row" | jq -r .databaseId)"
                  echo "ci_run_id=$run_id" >> "$GITHUB_OUTPUT"
                  echo "GEO-INFER CI run $run_id passed on $GITHUB_SHA ($GITHUB_REF_NAME); release proceeds"
                  exit 0
                fi
                echo "FAIL: GEO-INFER CI on $GITHUB_SHA concluded '$conclusion'; blocking the wheel release" >&2
                exit 1
              fi
            fi
            echo "Waiting for GEO-INFER CI on $GITHUB_SHA ..."
            [ "$(date +%s)" -lt "$deadline" ] || {
              echo "FAIL: GEO-INFER CI did not finish within 120 minutes of the tag push" >&2
              exit 1
            }
            sleep 60
          done

  release:
    needs: ci-gate
    if: ${{ !cancelled() && (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    # REL-02: `gh release upload` writes assets onto the release object, which
    # the workflow-level `contents: read` cannot do. The grant is scoped to
    # this job so the ci-gate poller keeps its read-only token.
    # REL-03: a job-level block replaces the workflow-level grant wholesale,
    # so `actions: read` is restated for the cross-run manuscript download.
    permissions:
      contents: write
      actions: read
    # GS19-22: an unbounded release job could hang the whole release pipeline
    # behind the concurrency queue; the 45-wheel build + verify fits well
    # inside this ceiling.
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-suffix: wheelrelease
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            .python-version

      - name: Install locked workspace dependencies
        run: |
          uv sync --locked --python "$(command -v python)" --all-packages --all-extras --all-groups \
            --no-install-package cupy --no-install-package mayavi \
            --no-install-package vaex --no-install-package vaex-core

      - name: Validate packaging configuration namespace
        run: |
          uv run python GEO-INFER-TEST/validate_packaging.py --strict
          uv run python GEO-INFER-TEST/validate_repo_contracts.py --skip-import-smoke

      - name: Build multi-package wheels
        # GS-002: the workflow_dispatch input defaults to opt-out semantics
        # and is empty on tag pushes, so the conditional is inverted: tag
        # builds always run the isolated-wheel verification and only an
        # explicit run_isolated_verify=false dispatch skips it.
        run: |
          uv run python GEO-INFER-TEST/build_package_wheels.py \
            --outdir dist \
            ${{ github.event.inputs.run_isolated_verify != 'false' && '--verify' || '' }}
      - name: Verify built wheels cover all distribution namespaces
        run: |
          uv run python - <<'EOF'
          from pathlib import Path
          dist = Path("dist")
          wheels = sorted(p.name for p in dist.glob("*.whl")) if dist.is_dir() else []
          print(f"Built {len(wheels)} wheels")
          if not wheels:
              print("FAIL: no wheels found in dist/; a zero-wheel build cannot be released")
              raise SystemExit(1)
          missing = [name for name in wheels if not name.startswith("geo_infer_")]
          if missing:
              print("FAIL: wheels outside geo_infer_ namespace: " + ", ".join(missing))
              raise SystemExit(1)
          for name in wheels:
              print("wheel: " + name)
          print("All wheels conform to the geo-infer-* namespace")
          EOF

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-infer-wheels
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

      # REL-02: the artifact above expires after 30 days and never reaches the
      # GitHub release object. That gap is how v0.3.0 shipped wheel-less behind
      # a green pipeline - the run succeeded, `geo-infer-wheels` existed, and
      # the release stayed PDF-only until a manual owner attach on 2026-09-27.
      # The attach is codified here; the retention artifact is complementary
      # and deliberately kept, so a failed attach still leaves the wheels.
      - name: Attach wheels to the release object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A workflow_dispatch can run at a branch, where no release object
          # exists. Both skip paths are loud (annotated) and never silent.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::notice::REL-02: ref '$GITHUB_REF_NAME' is a $GITHUB_REF_TYPE, not a tag; there is no release object to attach to. The wheels remain available as the 'geo-infer-wheels' artifact."
            exit 0
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::REL-02: no release object exists for tag '$GITHUB_REF_NAME'; wheels were NOT attached. Create the release and re-run this workflow, or attach manually: gh release upload $GITHUB_REF_NAME dist/*.whl --clobber"
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber --repo "$GITHUB_REPOSITORY"
          built="$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')"
          attached="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[] | select(.name | endswith(".whl"))] | length')"
          echo "Release $GITHUB_REF_NAME now carries $attached .whl assets ($built built)"
          if [ "$attached" -lt "$built" ]; then
            echo "FAIL: release $GITHUB_REF_NAME carries $attached .whl assets but $built wheels were built" >&2
            exit 1
          fi

      # REL-03: v0.3.0 carries the manuscript PDF on its release object, but
      # no workflow put it there (it was a manual attach). The PDF is
      # rendered by ci.yml's manuscript job (artifact
      # `geo-infer-manuscript-render-receipts`);
      # rendering LaTeX here would break the 60-minute release ceiling, so the
      # attach downloads that artifact from the exact CI run the ci-gate
      # validated. The asset keeps the prior release shape:
      # GEO-INFER-manuscript-<release date>.pdf.
      - name: Attach the manuscript PDF to the release object
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.ci-gate.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::notice::REL-03: ref '$GITHUB_REF_NAME' is a $GITHUB_REF_TYPE, not a tag; there is no release object to attach the manuscript PDF to."
            exit 0
          fi
          if [ -z "$CI_RUN_ID" ]; then
            echo "::warning::REL-03: this dispatch skipped the ci-gate, so no validated CI run exists to source the manuscript PDF from; the PDF was NOT attached. Attach it from the tag's successful CI run: gh run download <run-id> --name geo-infer-manuscript-render-receipts"
            exit 0
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::REL-03: no release object exists for tag '$GITHUB_REF_NAME'; the manuscript PDF was NOT attached. Create the release and re-run this workflow, or attach manually: gh run download $CI_RUN_ID --name geo-infer-manuscript-render-receipts"
            exit 0
          fi
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name geo-infer-manuscript-render-receipts --dir manuscript-receipts
          pdf="manuscript-receipts/GEO-INFER_combined.pdf"
          if [ ! -s "$pdf" ]; then
            echo "FAIL: CI run $CI_RUN_ID's render receipts carry no GEO-INFER_combined.pdf" >&2
            exit 1
          fi
          released="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json createdAt --jq '.createdAt[0:10]')"
          asset="GEO-INFER-manuscript-${released}.pdf"
          cp "$pdf" "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          # Capture before matching: under pipefail an early-exiting
          # `grep -q` can SIGPIPE the producer and fake a failed attach.
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')"
          if ! printf '%s\n' "$assets" | grep -Fxq "$asset"; then
            echo "FAIL: release $GITHUB_REF_NAME does not carry $asset after the upload" >&2
            exit 1
          fi
          echo "Release $GITHUB_REF_NAME now carries $asset from CI run $CI_RUN_ID"

      - name: Prune uv cache
        if: always()
        continue-on-error: true
        run: uv cache prune --ci