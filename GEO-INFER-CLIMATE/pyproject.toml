[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-climate"
version = "0.4.0"
description = "Climate modeling, weather analysis, and climate change impact assessment for geospatial systems"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "climate",
    "weather",
    "climate-change",
    "geoinformatics",
    "climate-modeling",
    "downscaling",
    "climate-indices",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "xarray>=0.19.0",
]

[project.optional-dependencies]
grib = [
    "cfgrib>=0.9.9",
]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-timeout>=2.0.0",
    # Test-only spatial dependencies (used by tests/conftest.py fixtures)
    "geopandas>=0.13.0",
    "h3>=4.5.0,<5",
    "shapely>=2.0.0",
    # Test-only runtime dep (pandas used by tests/examples only, no src imports)
    "pandas>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

