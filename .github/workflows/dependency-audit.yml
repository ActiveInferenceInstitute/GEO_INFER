name: Frozen workspace dependency audit

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
  schedule:
    - cron: "35 5 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.13.1"
          enable-cache: false
      - name: Install the isolated advisory tool
        run: |
          uv venv "${{ runner.temp }}/dependency-audit-tools" --python "$(command -v python)"
          uv pip install --python "${{ runner.temp }}/dependency-audit-tools/bin/python" "pip-audit==2.10.1" "psutil==7.0.0"
      - name: Audit every frozen workspace package version
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-dependency-audit
        run: |
          "${{ runner.temp }}/dependency-audit-tools/bin/python" GEO-INFER-TEST/audit_dependencies.py \
            --auditor "${{ runner.temp }}/dependency-audit-tools/bin/pip-audit" \
            --timeout 1200
      - name: Retain actual inventory, advisories and failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geo-infer-dependency-audit
          path: .geo-infer-test-results/dependency-audit/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
