name: Paired GNN interchange

on:
  # Standalone PR feedback follows the surfaces that can change interchange.
  # ci.yml also calls this reusable workflow for every exact candidate on
  # main/tag/dispatch/schedule, independently of these path filters.
  # GS19-21: PR legs target main/develop like ci.yml so feature-branch PRs
  # stay cheap; a feature-branch run is available on demand via
  # workflow_dispatch (Actions tab or `gh workflow run`).
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "GEO-INFER-ACT/**"
      - "GEO-INFER-SPACE/**"
      - "GEO-INFER-TIME/**"
      - "GEO-INFER-TEST/src/**"
      - "GEO-INFER-TEST/tests/**"
      - "pyproject.toml"
      - "**/pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "conftest.py"
      - "GEO-INFER-TEST/*.py"
      - "GEO-INFER-TEST/validate_gnn_interchange.py"
      - ".github/gnn-pair.json"
      - ".github/workflows/gnn-interchange.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gnn-interchange-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  interchange:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: geo
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read reviewed companion revision
        id: pair
        working-directory: geo
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pair = json.loads(Path('.github/gnn-pair.json').read_text())
          assert pair['repository'] == 'ActiveInferenceInstitute/Generalized_Notation_Notation'
          assert re.fullmatch('[0-9a-f]{40}', pair['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + pair['revision'] + '\n')
          PY
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ActiveInferenceInstitute/Generalized_Notation_Notation
          ref: ${{ steps.pair.outputs.revision }}
          path: gnn
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          cache-dependency-glob: |
            geo/uv.lock
            gnn/uv.lock
      - name: Record both checkouts before installing
        run: |
          mkdir receipts
          git -C geo rev-parse HEAD > receipts/geo-revision.txt
          git -C gnn rev-parse HEAD > receipts/gnn-revision.txt
          cp geo/.github/gnn-pair.json receipts/pair.json
      - name: Install independent locked runtimes
        env:
          GEO_PYTHON: ${{ matrix.python }}
        run: |
          uv sync --project geo --locked --python "$GEO_PYTHON" --all-packages --all-extras --all-groups \
            --no-install-package cupy --no-install-package mayavi \
            --no-install-package vaex --no-install-package vaex-core
          uv sync --project gnn --locked --python 3.11 --extra dev --extra geo-infer
      - name: Export in GNN and infer in GEO
        run: |
          geo/.venv/bin/python geo/GEO-INFER-TEST/validate_gnn_interchange.py \
            --gnn-repo "$PWD/gnn" --gnn-python "$PWD/gnn/.venv/bin/python" \
            --output receipts/interchange.json
      - name: Verify exact candidate receipt and retained artifacts
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          receipt = json.loads(Path('receipts/interchange.json').read_text())
          pair = json.loads(Path('geo/.github/gnn-pair.json').read_text())
          assert receipt['schema_version'] == '1.0' and receipt['success'] is True
          assert receipt['geo']['revision'] == os.environ['GITHUB_SHA']
          assert receipt['gnn']['revision'] == pair['revision']
          assert receipt['geo']['dirty'] is False and receipt['gnn']['dirty'] is False
          assert receipt['geo_execution']['custody_complete'] is True
          assert receipt['artifacts']
          for relative, digest in receipt['artifacts'].items():
              root = Path('receipts/interchange-artifacts').resolve()
              artifact = (root / relative).resolve()
              assert artifact.is_relative_to(root)
              assert hashlib.sha256(artifact.read_bytes()).hexdigest() == digest
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: paired-interchange-py${{ matrix.python }}
          path: receipts/
          if-no-files-found: error
          retention-days: 14
