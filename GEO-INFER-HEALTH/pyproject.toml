[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-health"
version = "0.4.0"
description = "Epidemiology, healthcare accessibility analysis, disease surveillance, and spatial health risk assessment"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "active inference",
    "geoinformatics",
    "health",
    "epidemiology",
    "accessibility",
    "surveillance",
    "risk-assessment",
    "healthcare",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.0",
    "loguru>=0.7.0",
    "geopandas>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "mypy>=0.910",
    # Test-only dependencies (imported by tests/, not by src/)
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "shapely>=2.0.0",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]
integrations = [
    # Workspace siblings imported by this module's tests (resolved via [tool.uv.sources])
    "geo-infer-test>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[project.scripts]
geo-infer-health = "geo_infer_health.cli:main"

[dependency-groups]
# Test-only dependencies (imported by tests/, not by src/ or any extra).
test = [
    "pyogrio>=0.7.2",
]

[tool.uv.sources]
geo-infer-test = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
