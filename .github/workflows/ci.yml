name: GEO-INFER CI

on:
  push:
    branches: ["main", "develop"]
    # GS-002: the wheel release's ci-gate job waits for a successful GEO-INFER
    # CI run on the exact tagged commit before any wheel upload.
    tags: ["v*"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
  schedule:
    # Scheduled runs confirm the same complete category matrix on the default branch.
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Each isolated module process has a bounded native CPU budget. The runner
# already bounds module-process concurrency; implicit BLAS/OpenMP pools must
# not multiply that budget or change deterministic numerical feedback.
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

concurrency:
  group: geo-infer-ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || (github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  paired-interchange:
    uses: ./.github/workflows/gnn-interchange.yml

  # GS-005: the interpreter-independent gates (repo contracts, syntax/test
  # contracts, model audit, source hygiene, gitleaks, coverage floor) ran
  # identically in every test matrix leg; they now execute once in this
  # dedicated job, and each test category becomes its own matrix job so wall
  # time is max(category) rather than sum(category).
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision PyTensor BLAS
        uses: ./.github/actions/provision-pytensor-blas

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-suffix: cpu-workspace-py3.11
          save-cache: false
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            .python-version

      - name: Install locked workspace dependencies
        uses: ./.github/actions/sync-cpu-workspace

      - name: Provision compatible DuckDB Spatial runtime
        run: |
          mkdir -p .geo-infer-test-results/provisioning
          uv run --no-sync python GEO-INFER-DATA/provision_duckdb_spatial.py \
            > .geo-infer-test-results/provisioning/duckdb-spatial.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('.geo-infer-test-results/provisioning/duckdb-spatial.json').read_text())
          assert receipt['status'] == 'verified' and receipt['extension'] == 'spatial'
          PY

      - name: Run code quality checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # shellcheck disable=SC2153
          base_sha="$BASE_SHA"
          # CI-02: a v* tag push carries the zero SHA in event.before (and
          # no PR base). The zero SHA passes the 40-hex regex but resolves
          # to no object, so the old fallback silently narrowed the diff to
          # HEAD^ — a different scope than the same SHA's push-to-main run.
          # Detect tag events and the zero SHA BEFORE the regex and measure
          # the full tree via the GS-004 empty-tree base.
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [[ "$base_sha" =~ ^0{40}$ ]]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          elif ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi

          # Exclude deleted paths: formatters and linters can only inspect
          # files that exist in the checked-out tree.
          changed_files="$(git diff --no-renames --name-only --diff-filter=ACMRTUXB "$base_sha" "$HEAD_SHA" -- '*.py')"
          if [ -z "$changed_files" ]; then
            echo "No Python files changed; skipping code quality checks."
            exit 0
          fi

          echo "Checking changed Python files:"
          printf '%s\n' "$changed_files"
          # Changed files are linted under the root pyproject [tool.ruff.lint]
          # contract (no rule-selection override), then format-checked.
          git diff --no-renames --name-only -z --diff-filter=ACMRTUXB "$base_sha" "$HEAD_SHA" -- '*.py' | \
            xargs -0 uv run --with 'ruff>=0.15.6,<0.16' ruff check
          git diff --no-renames --name-only -z --diff-filter=ACMRTUXB "$base_sha" "$HEAD_SHA" -- '*.py' | \
            xargs -0 uv run --with 'ruff>=0.15.6,<0.16' ruff format --check

      - name: Validate repository contracts
        run: |
          # GS-003: import-smoke and skills cross-reference problems used to
          # be advisory-only; both gates are now fatal so a package that
          # raises on import (or resolves from site-packages) and a broken
          # README/AGENTS<->SKILL cross-reference fail the job.
          uv run --no-sync python GEO-INFER-TEST/record_validation.py -- python GEO-INFER-TEST/validate_repo_contracts.py \
            --strict-source-language --strict-import-smoke
          uv run --no-sync python GEO-INFER-TEST/record_validation.py -- python GEO-INFER-TEST/validate_packaging.py --strict
          uv run --no-sync python GEO-INFER-TEST/record_validation.py -- python GEO-INFER-TEST/validate_logging_hygiene.py
          uv run --no-sync python GEO-INFER-TEST/record_validation.py -- python GEO-INFER-TEST/validate_documentation.py --strict
          uv run --no-sync python GEO-INFER-TEST/record_validation.py -- python GEO-INFER-TEST/validate_doc_examples.py
          uv run --no-sync python GEO-INFER-TEST/record_validation.py -- python GEO-INFER-TEST/validate_skills.py --check-xrefs --warnings-fatal
          uv run --no-sync python GEO-INFER-TEST/record_validation.py -- python GEO-INFER-TEST/validate_active_inference_contract.py
          uv run --no-sync python GEO-INFER-TEST/record_validation.py -- python GEO-INFER-TEST/rewrite_readme_agents.py --check

      - name: Run syntax and strict test contracts
        run: |
          python -m compileall GEO-INFER-*/src GEO-INFER-*/examples
          uv run --no-sync python GEO-INFER-TEST/record_validation.py -- python GEO-INFER-TEST/validate_test_contracts.py --strict

      - name: Run model contracts and reproducibility audit
        run: |
          uv run --no-sync python GEO-INFER-TEST/record_validation.py -- python GEO-INFER-TEST/validate_model_contracts.py --strict --seed 42
          uv run --no-sync python GEO-INFER-TEST/record_validation.py -- python GEO-INFER-TEST/run_model_audit.py --seed 42 --reproducible

      - name: Run source runtime hygiene
        run: |
          # The whole tree (src, tests, examples, scripts, manuscript) is
          # clean under the root pyproject [tool.ruff.lint] contract
          # (E4/E7/E9/F/UP/B/NPY); any new finding fails the gate.
          uv run --with 'ruff>=0.15.6,<0.16' ruff check .

      - name: Install pinned gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin --no-same-owner gitleaks
          gitleaks version

      - name: Scan full history for secrets
        # SEC-02: fail-closed scan over the full history with the committed
        # policy; allowlists are file- and rule-scoped with written
        # justifications (GEO-INFER-TEST/docs/secret_scan_policy.md).
        run: |
          uv run --no-sync python GEO-INFER-TEST/record_validation.py --timeout 1200 -- \
            gitleaks detect --source . --config .gitleaks.toml --redact --verbose

      - name: Prepare verified manuscript artifacts for ROOT coverage
        # ROOT's ordinary profile reads the published bundle and copies it
        # into an isolated hydration checkout. output/ is ignored, so every
        # fresh validation checkout must run its owning producer first.
        run: |
          uv run --no-sync python GEO-INFER-TEST/record_validation.py --timeout 1800 -- \
            python manuscript/generate_research_artifacts.py --verify --rerun-verification
          uv run --no-sync python GEO-INFER-TEST/record_validation.py --timeout 600 -- \
            python manuscript/generate_research_artifacts.py --check

      - name: Enforce module coverage floors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # shellcheck disable=SC2153
          # TEST-03: modules whose src or tests changed in this event are
          # re-measured and must meet their recorded floor
          # (GEO-INFER-TEST/coverage_baseline.json).
          # GS-004: the fallback is the empty tree, matching the code-quality
          # step: a base that cannot be resolved measures every module rather
          # than degrading to base==head and an unconditional pass.
          base_sha="$BASE_SHA"
          # CI-02: tag events (and any other zero-base event) carry the
          # zero SHA in event.before; the HEAD^ fallback would scope the
          # re-measured module set to only the tagged commit. Detect tag
          # events and the zero SHA BEFORE the regex and measure every
          # module via the empty-tree base, matching the code-quality step.
          if [ "$GITHUB_REF_TYPE" = "tag" ] || [[ "$base_sha" =~ ^0{40}$ ]]; then
            base_sha="$(git hash-object -t tree /dev/null)"
          elif ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            base_sha="$(git hash-object -t tree /dev/null)"
          fi
          uv run --with pytest-cov python GEO-INFER-TEST/record_validation.py --timeout 3600 -- \
            python GEO-INFER-TEST/check_coverage_floor.py \
            --base "$base_sha" --head "$HEAD_SHA" \
            --json .geo-infer-test-results/coverage-floors.json

      - name: Retain validation and model audit receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geo-infer-validation-receipts
          path: .geo-infer-test-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14


  fast-contracts:
    # Early feedback is independent of the full, required category matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-suffix: cpu-workspace-py3.11
          save-cache: false
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            .python-version

      - name: Install locked workspace dependencies
        uses: ./.github/actions/sync-cpu-workspace

      - name: Provision compatible DuckDB Spatial runtime
        run: |
          mkdir -p .geo-infer-test-results/provisioning
          uv run --no-sync python GEO-INFER-DATA/provision_duckdb_spatial.py \
            > .geo-infer-test-results/provisioning/duckdb-spatial.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('.geo-infer-test-results/provisioning/duckdb-spatial.json').read_text())
          assert receipt['status'] == 'verified' and receipt['extension'] == 'spatial'
          PY

      - name: Validate strict test contracts before runtime fixtures
        run: |
          uv run --no-sync python GEO-INFER-TEST/record_validation.py --timeout 120 -- \
            python GEO-INFER-TEST/validate_test_contracts.py --strict

      - name: Run execution and SPACE TIME composition contracts
        id: fast_tests
        run: |
          uv run --no-sync python GEO-INFER-TEST/run_unified_tests.py --timeout 600 --paths \
            GEO-INFER-TEST/tests/unit/test_execution_contracts.py \
            GEO-INFER-TEST/tests/unit/test_run_unified_tests.py \
            GEO-INFER-TEST/tests/unit/test_ci_workflow_contracts.py \
            GEO-INFER-TEST/tests/unit/test_check_coverage_floor_gate.py \
            GEO-INFER-TEST/tests/unit/test_documentation_census.py \
            GEO-INFER-TEST/tests/unit/test_process_ownership_contracts.py \
            GEO-INFER-TEST/tests/unit/test_measure_module_coverage.py \
            GEO-INFER-TEST/tests/integration/test_space_time_composition_contract.py
      - name: Retain fast contract receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geo-infer-fast-contract-receipts
          path: .geo-infer-test-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  process-contracts-windows:
    # Hosted Windows acceptance for the shared process-tree deadline contract.
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install process contract test dependency
        run: python -m pip install pytest==8.4.1 psutil==7.0.0
      - name: Run real Windows process and attempt contracts
        run: |
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'GEO-INFER-TEST/src'))
          from geo_infer_test.execution import run_command, SuiteReport, write_summary
          with tempfile.TemporaryDirectory() as directory:
              config = Path(directory) / 'pytest.ini'
              config.write_text('[pytest]\nfilterwarnings = error\n')
              command = [sys.executable, '-m', 'pytest', '--noconftest', '-p',
                         'geo_infer_test.selection', '-c', str(config),
                         str(root / 'GEO-INFER-TEST/tests/unit/test_execution_contracts.py'),
                         str(root / 'GEO-INFER-TEST/tests/unit/test_process_ownership_contracts.py'),
                         str(root / 'GEO-INFER-TEST/tests/unit/test_measure_module_coverage.py'),
                         # The native POSIX observer case runs in Linux contracts
                         # and module suites; Windows uses an explicit selection.
                         '-k', ('not (runtime_registry or programmatic_discovery or xdist or coverage_report '
                                'or nested_native_observers_preserve_target_tokens_and_detached_cleanup)'),
                         '--junitxml=windows-process.xml']
              result = run_command(command, 'Windows process contracts', timeout=300)
              write_summary(SuiteReport([result]), show_failures=True)
              raise SystemExit(0 if result.success else 1)
          PY
      - name: Retain Windows process receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geo-infer-windows-process-receipts
          path: .geo-infer-test-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  build-smoke:
    # GS-006: the real 45-wheel build previously first executed at release
    # time; candidate CI now builds and installs every member outside the
    # checkout, including separate base/extra behavior profiles.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Provision PyTensor BLAS
        uses: ./.github/actions/provision-pytensor-blas

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-suffix: build-smoke-py${{ matrix.python-version }}

      - name: Build and verify all installed wheels and dependency profiles
        # The shared process engine requires psutil for retained descendant
        # identity. No workspace sync is required; `uv build` resolves each
        # member's build backend in isolation. Verification retains receipts.
        run: |
          uv run --no-project --with psutil==7.0.0 python GEO-INFER-TEST/build_package_wheels.py \
            --outdir .geo-infer-test-results/wheels --verify --verify-extras

      - name: Validate installed wheel receipts before upload
        run: |
          uv run --no-project --with psutil==7.0.0 python GEO-INFER-TEST/validate_wheel_receipt.py \
            --directory .geo-infer-test-results/wheels --revision "$GITHUB_SHA" \
            --require-clean --require-imports --require-profiles

      - name: Retain installed wheel evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geo-infer-installed-wheel-receipts-py${{ matrix.python-version }}
          path: .geo-infer-test-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  workflow-lint:
    # GS-008: CI meta-gate. The workflow definitions carry non-trivial
    # embedded shell and GitHub expressions; actionlint fails them statically
    # before any runner time is spent.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          curl -fsSL -o /tmp/actionlint-checksums.txt \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_checksums.txt
          grep 'actionlint_1.7.7_linux_amd64.tar.gz' /tmp/actionlint-checksums.txt | \
            sed 's|actionlint_1.7.7_linux_amd64.tar.gz|/tmp/actionlint.tar.gz|' | \
            sha256sum -c -
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin --no-same-owner actionlint
          actionlint -version

      - name: Lint workflow definitions
        run: actionlint -color

  test:
    # GS-005: one leg per interpreter x category instead of two legs each
    # running all categories serially. Keep fail-fast=false; the artifact
    # names geo-infer-<category>-reports-py<version> are unchanged so any
    # required checks keyed on them stay stable.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        category: [unit, integration, performance, system, h3, slow]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision PyTensor BLAS
        uses: ./.github/actions/provision-pytensor-blas

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-suffix: cpu-workspace-py${{ matrix.python-version }}
          # One complete workspace writer per interpreter; other categories
          # restore the same lock-bound download cache without save races.
          save-cache: ${{ matrix.category == 'unit' }}
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            .python-version

      - name: Install locked workspace dependencies
        uses: ./.github/actions/sync-cpu-workspace

      - name: Provision compatible DuckDB Spatial runtime
        run: |
          mkdir -p .geo-infer-test-results/provisioning
          uv run --no-sync python GEO-INFER-DATA/provision_duckdb_spatial.py \
            > .geo-infer-test-results/provisioning/duckdb-spatial.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('.geo-infer-test-results/provisioning/duckdb-spatial.json').read_text())
          assert receipt['status'] == 'verified' and receipt['extension'] == 'spatial'
          PY

      - name: Run ${{ matrix.category }} tests
        id: category_tests
        run: |
          # ACT's real-H3 and visualization unit surface is CPU-bound on the
          # hosted runner; keep the per-module timeout explicit without
          # converting a slow but valid module into a false CI failure. The
          # per-category summary in run_unified_tests.py keeps a leg
          # approaching its ceiling visible before the job timeout trips.
          if [ "${{ matrix.category }}" = "h3" ]; then
            uv run --no-sync python GEO-INFER-TEST/run_unified_tests.py --h3-migration
          else
            uv run --no-sync python GEO-INFER-TEST/run_unified_tests.py \
              --category ${{ matrix.category }} \
              --timeout 600
          fi

      - name: Retain ${{ matrix.category }} test reports
        # GS-001: every category uploads its reports immediately after its
        # own run, so the shared results dir can never be wiped by a later
        # category before the upload (the performance artifact used to upload
        # system output because the system run wiped the dir first).
        if: always() && steps.category_tests.outcome != 'skipped' && steps.category_tests.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-infer-${{ matrix.category }}-reports-py${{ matrix.python-version }}
          path: .geo-infer-test-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Prune uv cache
        # Readers do not save a cache; prune only the selected cache writer.
        if: always() && matrix.category == 'unit'
        continue-on-error: true
        run: uv cache prune --ci

  manuscript:
    # The manuscript render scans the whole checkout and regenerates figures;
    # it is kept out of the fast test lane so a slow or broken render cannot
    # fail or delay the per-matrix validation jobs.
    runs-on: ubuntu-latest
    # The render stage adds an apt LaTeX toolchain install and a full
    # pandoc + XeLaTeX build to the existing verification run.
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision PyTensor BLAS
        uses: ./.github/actions/provision-pytensor-blas

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          cache-suffix: cpu-workspace-py3.11
          save-cache: false
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            .python-version

      - name: Install locked workspace dependencies
        uses: ./.github/actions/sync-cpu-workspace

      - name: Generate research artifacts
        run: |
          uv run python manuscript/generate_research_artifacts.py --verify

      - name: Validate bounded research evidence custody
        id: research_evidence
        if: always()
        run: |
          mkdir -p .geo-infer-test-results
          uv run --no-sync python GEO-INFER-TEST/validate_research_evidence.py \
            --receipt-path .geo-infer-test-results/research-custody.json

      - name: Retain research custody result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geo-infer-manuscript-research-custody
          path: .geo-infer-test-results/research-custody.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain generated research evidence
        if: ${{ always() && steps.research_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geo-infer-manuscript-research-evidence
          path: |
            output/data/research_manifest.json
            output/data/research_inventory.json
            output/data/research_verification.json
            output/data/manuscript_variables.json
            output/figures/figure_registry.json
          if-no-files-found: error
          retention-days: 14

      - name: Check published artifacts converge
        # output/ is gitignored: --check runs AFTER regeneration as the
        # shim-style post-condition, failing when the render did not converge.
        run: |
          uv run python manuscript/generate_research_artifacts.py --check
          echo "Manuscript staleness gate (--check): converged" >> "$GITHUB_STEP_SUMMARY"
      - name: Install the LaTeX render toolchain
        # Minimal fail-closed set: xelatex plus the packages the preamble
        # and pandoc's defaults need (seqsplit, fvextra, cleveref,
        # longtable), and poppler for the layout tests' pdftotext and
        # pdfinfo.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern poppler-utils

      - name: Install pinned pandoc and pandoc-crossref
        # pandoc-crossref is built against one pandoc version, so the pair
        # is installed from pinned release tarballs rather than from apt.
        run: |
          curl -fsSL -o /tmp/pandoc.tar.gz \
            https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  /tmp/pandoc.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/pandoc.tar.gz -C /usr/local --strip-components=1 \
            --no-same-owner pandoc-3.11/bin
          curl -fsSL -o /tmp/pandoc-crossref.tar.xz \
            https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.25/pandoc-crossref-Linux-X64.tar.xz
          echo "2319816e3545ee78e44e4a97c2174c72eedf4b51d436b32721b48f43458eb0f6  /tmp/pandoc-crossref.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/pandoc-crossref.tar.xz -C /usr/local/bin --no-same-owner \
            pandoc-crossref
          pandoc --version | head -1
          pandoc-crossref --version | head -1

      - name: Render the manuscript PDF
        # The in-repo render stage ROOT-01 deferred: it hydrates the
        # evidence bundle, combines the published sections, and runs pandoc
        # and XeLaTeX fail-closed. Its artifacts are the receipts the
        # render-dependent tests read.
        run: |
          uv run python scripts/render_manuscript_pdf.py

      - name: Run render-dependent root tests
        run: |
          uv run --no-sync python GEO-INFER-TEST/run_unified_tests.py \
            --module ROOT --category manuscript-render --timeout 600 --show-failures

      - name: Retain render receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-infer-manuscript-render-receipts
          path: |
            output/pdf/GEO-INFER_combined.pdf
            output/pdf/_combined_manuscript.md
            output/pdf/_combined_manuscript.tex
            output/pdf/_combined_manuscript.log
          if-no-files-found: warn
          retention-days: 14

      - name: Run root manuscript regression tests
        # ROOT is a registered target. Its ordinary manuscript profile
        # records render-dependent deselections; the complementary profile
        # above runs after producing the actual PDF and combined sources.
        run: |
          uv run --no-sync python GEO-INFER-TEST/run_unified_tests.py \
            --module ROOT --category manuscript --timeout 600 --show-failures

      - name: Retain root manuscript execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geo-infer-root-manuscript-test-receipts
          path: .geo-infer-test-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  optional-data-services:
    # Real disposable service operations complement the installed-wheel profiles.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: geo_test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: geo_test
        ports:
          - 127.0.0.1:15432:5432
        options: >-
          --health-cmd "pg_isready -U geo_test -d geo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.11-alpine3.21
        ports:
          - 127.0.0.1:16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.7"
          enable-cache: true
          save-cache: false
          cache-suffix: cpu-workspace-py3.12
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
            .python-version
      - uses: ./.github/actions/provision-pytensor-blas
      - uses: ./.github/actions/sync-cpu-workspace
      - name: Build pinned official MinIO source
        run: |
          mkdir -p .geo-infer-test-results/services/bin
          go version > .geo-infer-test-results/services/go-version.txt
          docker image inspect postgis/postgis:16-3.5 redis:7.4.11-alpine3.21 \
            --format '{{json .RepoDigests}}' > .geo-infer-test-results/services/container-digests.txt
          GOBIN="$PWD/.geo-infer-test-results/services/bin" go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
      - name: Verify real storage services
        env:
          MINIO_ROOT_USER: geo_test
          MINIO_ROOT_PASSWORD: disposable-test-only
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          .geo-infer-test-results/services/bin/minio server .geo-infer-test-results/services/minio-data \
            --address 127.0.0.1:19000 --console-address 127.0.0.1:19001 \
            > .geo-infer-test-results/services/minio.log 2>&1 &
          MINIO_TEST_PID=$!
          trap 'kill "$MINIO_TEST_PID" 2>/dev/null || true; wait "$MINIO_TEST_PID" 2>/dev/null || true' EXIT
          .geo-infer-test-results/services/bin/minio --version > .geo-infer-test-results/services/minio-version.txt
          sha256sum .geo-infer-test-results/services/bin/minio > .geo-infer-test-results/services/minio-sha256.txt
          go version -m .geo-infer-test-results/services/bin/minio > .geo-infer-test-results/services/minio-build.txt
          # Retry readiness only; operation failures below are never retried.
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/ready > /dev/null; then
              break
            fi
            kill -0 "$MINIO_TEST_PID"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:19000/minio/health/ready > /dev/null
          uv run --no-sync python GEO-INFER-DATA/tests/service_contract_probe.py \
            > .geo-infer-test-results/services/contracts.json 2> .geo-infer-test-results/services/contracts.stderr
      - name: Upload service operation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geo-infer-optional-data-service-contracts
          path: |
            .geo-infer-test-results/services/contracts.json
            .geo-infer-test-results/services/contracts.stderr
            .geo-infer-test-results/services/*-version.txt
            .geo-infer-test-results/services/*-digests.txt
            .geo-infer-test-results/services/*-sha256.txt
            .geo-infer-test-results/services/*-build.txt
          if-no-files-found: error
          retention-days: 14
