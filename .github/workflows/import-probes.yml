name: Import probe portability

on:
  # CI-09: no push leg. A merge to main re-ran the full probe matrix that the
  # PR leg had just run on the identical tree (GS-007 removed the same
  # duplicate from gnn-interchange.yml); post-merge probes are on demand via
  # workflow_dispatch.
  # GS19-21: PR legs target main/develop like ci.yml so feature-branch PRs
  # stay cheap; a feature-branch run is available on demand via
  # workflow_dispatch (Actions tab or `gh workflow run`).
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.15", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          cache-dependency-glob: uv.lock
      - name: Resolve the locked pytest version for the probe tools
        # GS19-23: the probe tools previously hardcoded pytest==8.4.2 while
        # the workspace lock carries 8.4.1 — drift by construction. Derive
        # the pytest version from uv.lock at runtime; `build` is not a
        # workspace-locked distribution, so it stays a reviewed explicit
        # pin (GEO-INFER-TEST/docs/pin_review_2026-Q3.md tracks tool pins).
        id: locked_tools
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          pytest_version = None
          psutil_version = None
          for pkg in tomllib.loads(
              Path("uv.lock").read_text(encoding="utf-8")
          ).get("package", []):
              if pkg.get("name") == "pytest" and pkg.get("version"):
                  pytest_version = pkg["version"]
              if pkg.get("name") == "psutil" and pkg.get("version"):
                  psutil_version = pkg["version"]
          if not pytest_version:
              raise SystemExit(
                  "uv.lock carries no pytest entry; cannot derive the probe pytest version"
              )
          if not psutil_version:
              raise SystemExit("uv.lock carries no psutil entry; process identity checks cannot run")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"pytest_version={pytest_version}\n")
              output.write(f"psutil_version={psutil_version}\n")
      - name: Install standalone probe test tools
        run: >-
          python -m pip install
          "pytest==${{ steps.locked_tools.outputs.pytest_version }}"
          "psutil==${{ steps.locked_tools.outputs.psutil_version }}"
          build==1.3.0
      - name: Exercise real source and installed-wheel subprocesses
        # These tooling tests need no geospatial runtime or workspace fixtures.
        # In particular Windows must execute taskkill, not a mocked POSIX path.
        run: >-
          python -m pytest --noconftest -c GEO-INFER-TEST/config/import-probes.ini -q
          GEO-INFER-TEST/tests/unit/test_validate_repo_contracts.py
          GEO-INFER-TEST/tests/unit/test_build_package_wheels.py
          --junitxml=probe-results.xml
      - name: Record platform and revision
        if: always()
        run: python -c "import platform,sys,subprocess,json; print(json.dumps(dict(platform=platform.platform(),python=sys.version,revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: import-probes-${{ matrix.os }}-${{ matrix.python }}
          path: probe-results.xml
          if-no-files-found: error
          retention-days: 14

  agent-transports:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Resolve the workspace pytest pin
        id: locked_tools
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))["package"]
          version = next(p["version"] for p in packages if p["name"] == "pytest")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"pytest_version={version}\n")
      - name: Exercise native agent CLI and MCP transports
        run: >-
          uv run --frozen --package geo-infer-api --extra mcp --no-default-groups
          --with "pytest==${{ steps.locked_tools.outputs.pytest_version }}"
          python -m pytest --noconftest -c GEO-INFER-TEST/config/import-probes.ini -q
          GEO-INFER-API/tests/unit/test_agent_stdio.py
          --junitxml="${{ runner.temp }}/agent-transports.xml"
      - name: Bind platform, source and lock
        if: always()
        shell: python
        run: |
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path
          paths = subprocess.check_output(["git", "ls-files", "GEO-INFER-API", ".github/workflows/import-probes.yml", "uv.lock"], text=True).splitlines()
          record = dict(platform=platform.platform(), python=sys.version,
                        revision=subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                        dirty=subprocess.check_output(["git", "status", "--porcelain"], text=True),
                        files={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths if Path(p).is_file()})
          Path(os.environ["RUNNER_TEMP"], "agent-platform.json").write_text(json.dumps(record, indent=2), encoding="utf-8")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-transports-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/agent-transports.xml
            ${{ runner.temp }}/agent-platform.json
          if-no-files-found: error
          retention-days: 14
