[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-infer-space"
version = "0.4.0"
description = "H3 v4 spatial indexing and comprehensive geospatial analysis framework with advanced spatial methods and coordinate transformations"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11"
authors = [
    {name = "GEO-INFER Development Team", email = "geo-infer@activeinference.institute"}
]
keywords = [
    "geospatial",
    "active inference",
    "geoinformatics",
    "spatial-analysis",
    "h3",
    "coordinate-systems",
    "spatial-indexing",
    "geometric-operations",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "geo-infer-time>=0.4.0",
    "fastapi>=0.100.0",
    "fiona>=1.8.0",
    "geojson-pydantic>=2.0.0",
    "geopandas>=0.13.0",
    "h3>=4.5.0,<5",
    "networkx>=2.6.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "pyproj>=3.3.0",
    "python-multipart>=0.0.5",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "rasterio>=1.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "shapely>=2.0.0",
    "uvicorn>=0.15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.6,<0.16",
    "mypy>=0.910",
]
docs = [
    "sphinx>=4.2.0",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "myst-parser>=0.15.0",
]
optional = [
    "laspy>=2.0.0",
    "osmnx>=1.2.0",
    "srai>=0.10.2",
    "xarray>=0.20.0",
    "rioxarray>=0.11.0",
    "numba>=0.56.0",
    "dask>=2021.10.0",
    "dask[dataframe]>=2021.10.0",
    "redis>=4.0.0"
]
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "folium>=0.12.0"
]
all = [
    "dask>=2021.10.0",
    "dask[dataframe]>=2021.10.0",
    "folium>=0.12.0",
    "geo-infer-math>=0.4.0",
    "geo-infer-test>=0.4.0",
    "laspy>=2.0.0",
    "matplotlib>=3.5.0",
    "mypy>=0.910",
    "myst-parser>=0.15.0",
    "nbsphinx>=0.8.0",
    "numba>=0.56.0",
    "osmnx>=1.2.0",
    "plotly>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=2.12.0",
    "pytest>=6.2.0",
    "redis>=4.0.0",
    "rioxarray>=0.11.0",
    "ruff<0.16,>=0.15.6",
    "seaborn>=0.11.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx>=4.2.0",
    "srai>=0.10.2",
    "xarray>=0.20.0",
]
integrations = [
    # Workspace siblings imported by this module's tests (resolved via [tool.uv.sources])
    "geo-infer-math>=0.4.0",
    "geo-infer-test>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
Documentation = "https://geo-infer.readthedocs.io/"
Repository = "https://github.com/ActiveInferenceInstitute/GEO_INFER"
"Bug Tracker" = "https://github.com/ActiveInferenceInstitute/GEO_INFER/issues"

[project.scripts]
# No scripts (legacy tools removed)

[tool.uv.sources]
geo-infer-time = { workspace = true }
geo-infer-math = { workspace = true }
geo-infer-test = { workspace = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.md", "*.txt"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
