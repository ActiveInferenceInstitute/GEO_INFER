# Cascadia Indigenous Nations and Territories
# Source: Bureau of Indian Affairs (BIA) tribal directory, 2024
# NAGPRA and treaty rights data from US Dept of Interior

metadata:
  total_federally_recognized_tribes: 52
  states: ["CA", "OR", "WA", "ID"]
  province: ["BC"]
  data_source: "Bureau of Indian Affairs, BC Treaty Commission, tribal websites"
  note: "Boundaries are approximate; traditional territories overlap and predate current political boundaries"

