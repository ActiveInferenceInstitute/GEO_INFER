# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.1
  updated: '2026-11-10'
repo:
  name: GEO_INFER
  slug: geo_infer
  full_name: ActiveInferenceInstitute/GEO_INFER
  description: GEO-INFER is a 45-module geospatial inference monorepo for spatial
    analysis, active inference, domain modeling, agent workflows, and repository validation.
institute:
  category: research-software
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    note: Uses Active Inference Ontology terms.
  - repo: ActiveInferenceInstitute/pymdp
    relation: depends-on
    note: Consumes the pymdp active-inference library.
  links:
    github: https://github.com/ActiveInferenceInstitute/GEO_INFER
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview.
- path: pyproject.toml
  kind: code
  description: Python package config.
- path: LICENSE
  kind: doc
  description: License.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: CITATION.cff
  kind: citation
  description: Machine-readable citation metadata.
- path: tests
  kind: test
  description: Test suite.
- path: manuscript
  kind: publication
  description: Manuscript sources and artifacts.
- path: CHANGELOG.md
  kind: doc
  description: Changelog.
provenance:
  license: CC-BY-NC-SA-4.0
  citation:
    text: Active Inference Institute — GEO-INFER.
instituteos:
  tags:
  - geo-infer
  - geospatial
  - active-inference
  - modules
  - html
capabilities:
- python-package
- tested
- ci
- citation
- manuscript-publication
tasks:
  test:
    cmd: uv run python GEO-INFER-TEST/run_unified_tests.py --category unit
    description: Run the test suite.
docs:
- README.md
- AGENTS.md
- docs/INTEGRATION.md
- docs/README.md
- docs/AGENTS.md
schema: aii-sidecar/v1
